<style>
/* Layout: a chalkboard header over a paper desk; one big card in the middle, chunky tap targets for 7-year-olds */
:root{
  --bg:#f3f6ee; --paper:#ffffff; --ink:#22312a; --muted:#5f7068;
  --board:#2f5d4a; --chalk:#f7f3e3; --sun:#f4b63b; --sky:#3a86d6;
  --good:#2e9b5b; --bad:#d9534f; --line:#d9e2d6; --soft:#e8efe4; --rec:#e0475b;
  --display:"Baloo 2","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,sans-serif;
  --ipa:"Noto Sans","Segoe UI","DejaVu Sans",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#18211d; --paper:#22302a; --ink:#eef3ea; --muted:#a8b8ae; --board:#1f4636; --chalk:#f7f3e3;
  --sun:#f6c45a; --sky:#6aa8ec; --good:#4cc27e; --bad:#ef7470; --line:#34473e; --soft:#2b3b34; --rec:#f0687a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18211d; --paper:#22302a; --ink:#eef3ea; --muted:#a8b8ae; --board:#1f4636; --chalk:#f7f3e3;
  --sun:#f6c45a; --sky:#6aa8ec; --good:#4cc27e; --bad:#ef7470; --line:#34473e; --soft:#2b3b34; --rec:#f0687a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.board{background:var(--board);color:var(--chalk);border-radius:18px;padding:14px 18px;border:6px solid #8a6a43;display:flex;align-items:center;gap:12px;justify-content:space-between}
header.board h1{font-family:var(--display);font-size:1.5rem;margin:0;line-height:1.1;text-wrap:balance}
header.board small{opacity:.8;font-size:.85rem}
.stars{font-family:var(--display);font-size:1.3rem;white-space:nowrap}
button,.btn{font:inherit;cursor:pointer;border:none;border-radius:14px;color:inherit}
button:focus-visible,label.btn:focus-within{outline:3px solid var(--sky);outline-offset:2px}
.btn{background:var(--paper);border:2px solid var(--line);padding:12px 16px;font-weight:800;min-height:52px;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn.primary{background:var(--sun);border-color:var(--sun);color:#2a1e00}
.btn.blue{background:var(--sky);border-color:var(--sky);color:#fff}
.btn.red{background:var(--rec);border-color:var(--rec);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.btn:active{transform:translateY(2px)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:18px;margin-top:14px}
.label{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.pic{width:100%;max-width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:14px;background:var(--soft);display:block}
.word{font-family:var(--display);font-size:2.3rem;line-height:1.1;margin:10px 0 2px}
.ipa{font-family:var(--ipa);font-size:1.25rem;color:var(--sky)}
.read{color:var(--muted);font-size:.95rem}
.vi{display:inline-block;background:var(--soft);border-radius:999px;padding:4px 14px;font-weight:800;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opt{background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:8px;font-weight:800;font-size:1.1rem;min-height:60px}
.opt img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;display:block}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 15%,var(--paper))}
.opt.no{border-color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.prog{height:12px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.stage{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.stage span{font-size:.8rem;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.stage span.on{background:var(--sun);color:#2a1e00}
.stage span.done{background:var(--good);color:#fff}
.slots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:14px 0;min-height:52px}
.slot{width:40px;height:48px;border-bottom:4px solid var(--muted);font-family:var(--display);font-size:1.6rem;display:flex;align-items:center;justify-content:center}
.gap{width:16px}
.tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tile{width:46px;height:52px;background:var(--sun);color:#2a1e00;font-family:var(--display);font-size:1.5rem;border-radius:12px}
.tile[disabled]{opacity:.2}
.tile.no{background:var(--bad);color:#fff;animation:shake .35s}
.tile.ok{background:var(--good);color:#fff}
input.type{width:100%;font:800 1.5rem var(--display);padding:12px;border-radius:14px;border:3px solid var(--line);background:var(--bg);color:var(--ink);text-align:center;margin-top:12px}
.fb{min-height:28px;font-weight:800;margin-top:10px;text-align:center}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.learnlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.mini{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:8px;text-align:left}
.mini b{font-family:var(--display);font-size:1.15rem;display:block;margin-top:4px}
.mini span{font-family:var(--ipa);color:var(--sky);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{background:var(--soft);border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:800;min-height:44px}
.center{text-align:center}
.big{font-family:var(--display);font-size:3rem;line-height:1}
p.tip{color:var(--muted);font-size:.95rem;margin:.4em 0}
/* flip card */
.flip{perspective:1200px;margin-top:10px;cursor:pointer}
.flip-in{display:grid;transition:transform .55s;transform-style:preserve-3d}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:14px;border:3px solid var(--line);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:330px}
.face.back{transform:rotateY(180deg);background:var(--board);color:var(--chalk);border-color:#8a6a43}
.face.back .ipa{color:var(--sun);font-size:1.6rem}
.face.back .vi{background:var(--chalk);color:#22312a;font-size:1.3rem}
.face.back .read{color:var(--chalk);opacity:.85}
.turn{font-size:.85rem;color:var(--muted);margin-top:6px}
.face.back .turn{color:var(--chalk);opacity:.7}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--sun)}
/* recorder */
.rec{margin-top:14px;padding:12px;border:2px dashed var(--line);border-radius:16px}
.rec .btn.recording{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
/* extra letter */
.extra{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:16px 0}
/* fill blank */
.sent{font-family:var(--display);font-size:1.5rem;line-height:1.6;text-align:center;margin-top:12px}
.blank{font:800 1.3rem var(--display);border:none;border-bottom:4px dashed var(--sky);background:var(--soft);color:var(--ink);text-align:center;border-radius:8px 8px 0 0;padding:2px 6px;max-width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const SUMAP={'coloring a square':'coloring',"what's she doing":'whatdoing','doing a quiz':'quiz','how many':'howmany'};let suAu=null;
function say(t,slow){try{const k=SUMAP[t];if(k&&SU[k]){speechSynthesis.cancel();if(suAu){suAu.pause()}suAu=new Audio(SU[k]);suAu.playbackRate=slow?0.75:1;suAu.play().catch(()=>{});return}}catch(e){}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=slow?0.7:0.88;u.pitch=1;speechSynthesis.speak(u)}catch(e){}}
let ac=null;
function beep(ok){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);const t=ac.currentTime;
 if(ok){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(990,t+.1)}else{o.frequency.setValueAtTime(220,t)}
 g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3)}catch(e){}}
const sp=w=>`<div class="row" style="margin-top:12px"><button class="btn blue" onclick="event.stopPropagation();sayW('${w.id}')">🔊 Nghe</button><button class="btn" onclick="event.stopPropagation();sayW('${w.id}',1)">🐢 Nghe chậm</button></div>`;

/* ---- recorder: record own voice, play it back next to the model voice ---- */
let REC={url:null,mr:null,stream:null,timer:null,audio:null};
function stopRec(){try{clearTimeout(REC.timer);if(REC.mr&&REC.mr.state==='recording')REC.mr.stop();if(REC.stream)REC.stream.getTracks().forEach(t=>t.stop());if(REC.audio)REC.audio.pause()}catch(e){}REC.mr=null;REC.stream=null}
function recHTML(){return `<div class="rec" onclick="event.stopPropagation()">
 <div class="label">🎙️ Thu âm giọng con</div>
 <div class="row" style="margin-top:8px">
  <button class="btn red" id="recBtn">🔴 Thu âm</button>
  <label class="btn red" id="recLbl" hidden>🎙️ Mở máy ghi âm<input type="file" id="recFile" accept="audio/*" capture hidden></label>
  <button class="btn" id="playMine" disabled>▶ Nghe giọng con</button>
  <button class="btn blue" id="playModel">🔊 Giọng mẫu</button>
 </div>
 <audio id="mineAudio" controls playsinline preload="auto" hidden style="width:100%;margin-top:10px"></audio>
 <p class="tip" id="recTip">Bấm Thu âm, đọc to từ, rồi bấm Dừng. Sau đó nghe lại giọng con và so với giọng mẫu.</p></div>`}
function bindRec(w){
 stopRec(); REC.url=null;
 const btn=$('#recBtn'),lbl=$('#recLbl'),file=$('#recFile'),mine=$('#playMine'),tip=$('#recTip');
 if(!btn)return;
 const au=$('#mineAudio');REC.audio=au;
 // turn the recording into a data: URL so the player is allowed to load it
 const ready=blob=>{if(!blob||!blob.size){tip.textContent='Chưa thu được tiếng, con bấm Thu âm và nói to hơn nhé.';return}
  const fr=new FileReader();fr.onload=()=>{REC.url=fr.result;au.src=fr.result;au.hidden=false;try{au.load()}catch(e){}mine.disabled=false;
   tip.textContent='Đã thu xong! Bấm "Nghe giọng con" hoặc nút ▶ trên thanh phát để nghe lại.'};
  fr.onerror=()=>{tip.textContent='Không đọc được bản thu, con thử thu lại nhé.'};fr.readAsDataURL(blob)};
 const playMine=()=>{if(!REC.url)return;try{speechSynthesis.cancel()}catch(e){}try{au.currentTime=0;const p=au.play();if(p&&p.catch)p.catch(()=>{tip.textContent='Máy chưa phát được, con bấm nút ▶ trên thanh phát bên dưới nhé.'})}catch(e){}};
 const fallback=()=>{btn.hidden=true;lbl.hidden=false;tip.textContent='Trang này chưa mở được micro trực tiếp. Bấm "Mở máy ghi âm" để thu bằng ứng dụng ghi âm của máy, rồi quay lại nghe.'};
 mine.onclick=playMine;
 $('#playModel').onclick=()=>say(w.en);
 file.onchange=()=>{const f=file.files&&file.files[0];if(f)ready(f)};
 btn.onclick=async()=>{
  if(REC.mr&&REC.mr.state==='recording'){REC.mr.stop();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){fallback();return}
  try{
   const st=await navigator.mediaDevices.getUserMedia({audio:true});REC.stream=st;
   const chunks=[];const mr=new MediaRecorder(st);REC.mr=mr;
   mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
   mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());btn.textContent='🔴 Thu lại';btn.classList.remove('recording');
    ready(new Blob(chunks,{type:(mr.mimeType||'audio/webm').split(';')[0]}))};
   mr.start();btn.textContent='⏹ Dừng';btn.classList.add('recording');tip.textContent='Đang thu... con đọc to nhé!';
   REC.timer=setTimeout(()=>{if(mr.state==='recording')mr.stop()},6000);
  }catch(e){fallback()}
 };
}

  </div>
  <div class="label" style="margin-top:16px">Hoặc chơi từng phần</div>
  <div class="chips">${STAGES.map((s,i)=>`<button class="chip" onclick="play([${i}])">${s.name}</button>`).join('')}</div>
  <div style="margin-top:16px"><label class="label" for="vsel">Giọng đọc (chọn giọng có chữ Natural hoặc Online nghe sẽ tự nhiên nhất)</label>
   <div class="row" style="margin-top:6px"><select id="vsel" class="btn" style="flex:3 1 200px;min-width:0" onchange="setVoice(this.value)"></select><button class="btn blue" style="flex:1 1 90px" onclick="say('Hello! I am ready. Desk, tens, ones.')">🔊 Thử</button></div></div>
  ${best?`<p class="tip center" style="margin-top:10px">Kỷ lục của con: ⭐ ${best}</p>`:''}
 </div>
 <div class="learnlist">${W.map((w,i)=>`<button class="mini" onclick="learn(${i})"><img class="pic" src="${IMG[w.id]}" alt=""><b>${w.en}</b><span>${w.ipa}</span><div class="read">${w.vi}</div></button>`).join('')}</div>`;
 fillVoices($('#vsel'));
}

/* ---- learn: flip cards ---- */
function learn(i){
 stopRec();
 const w=W[i];
 app.innerHTML=`<div class="card">
  <div class="label">Thẻ lật ${i+1}/7</div>
  <div class="flip" id="flip" role="button" tabindex="0" aria-label="Lật thẻ">
   <div class="flip-in">
    <div class="face front">
     <img class="pic" src="${IMG[w.id]}" alt="">
     <div class="word">${w.en}</div>
     <div class="turn">👆 Chạm để lật thẻ, xem nghĩa</div>
    </div>
    <div class="face back">
     <div class="word">${w.en}</div>
     <div class="ipa">${w.ipa}</div>
     <div class="read">Đọc gần giống: <b>${w.rd}</b></div>
     <div class="vi" style="margin-top:12px">${w.vi}</div>
     <div class="read" style="margin-top:12px">Đánh vần: <b>${w.en.toUpperCase().split(' ').map(x=>x.split('').join(' ')).join(' &nbsp;/&nbsp; ')}</b></div>
     <div class="turn">👆 Chạm để lật lại</div>
    </div>
   </div>
  </div>
  ${sp(w)}
  ${recHTML()}
  <div class="dots">${W.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>
  <div class="row" style="margin-top:10px">
   <button class="btn" onclick="${i?`learn(${i-1})`:'home()'}">← ${i?'Thẻ trước':'Về đầu'}</button>
   ${i<6?`<button class="btn primary" onclick="learn(${i+1})">Thẻ tiếp →</button>`:`<button class="btn primary" onclick="play()">▶ Chơi ngay</button>`}
  </div></div>`;
 const f=$('#flip');const tg=()=>{f.classList.toggle('flipped');say(w.en)};
 f.onclick=tg;f.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tg()}};
 // swipe left/right to change card
 let x0=null;f.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
 f.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>60){if(dx<0&&i<6)learn(i+1);else if(dx>0&&i>0)learn(i-1)}});
 bindRec(w);
 say(w.en);
}

/* ---- game ---- */
let G;
function play(only){
 setStars(0);
 const list=only||STAGES.map((_,i)=>i);
 G={list,si:0,queue:shuffle(W),done:0,total:W.length*list.length,miss:{}};
 next();
}
const curStage=()=>STAGES[G.list[G.si]];
function head(){
 const pct=Math.round(G.done/G.total*100);
 return `<div class="stage">${G.list.map((k,i)=>`<span class="${i<G.si?'done':i==G.si?'on':''}">${STAGES[k].name}</span>`).join('')}</div>
 <div class="prog"><i style="width:${pct}%"></i></div>`;
}
function next(){
 stopRec();
 if(!G.queue.length){G.si++;if(G.si>=G.list.length)return finish();G.queue=shuffle(W)}
 const w=G.queue[0], s=curStage();
 app.innerHTML=head()+`<div class="card"><div class="label">${s.hint}</div><div id="task"></div><div class="fb" id="fb"></div><div id="nextBox"></div></div>`;
 ({listen,read,extra,build,speak,fill,write})[s.k](w);
}
function result(ok,w,msg,manual){
 const fb=$('#fb');
 if(ok){beep(1);setStars(stars+1);fb.className='fb ok';fb.textContent=msg||'Giỏi quá! 🎉';G.queue.shift();G.done++;}
 else{beep(0);fb.className='fb no';fb.textContent=msg||'Chưa đúng, con thử lại nhé!';G.miss[w.id]=(G.miss[w.id]||0)+1;
  // put the word back a little later in this stage so it gets practised again
  G.queue.shift();G.queue.splice(Math.min(2,G.queue.length),0,w);}
 if(manual){$('#nextBox').innerHTML=`<div class="row" style="margin-top:12px"><button class="btn primary" id="goNext">Tiếp →</button></div>`;$('#goNext').onclick=next}
 else setTimeout(next,ok?900:1500);
}
function miss(w,text){beep(0);G.miss[w.id]=(G.miss[w.id]||0)+1;$('#fb').className='fb no';$('#fb').textContent=text}
function options(w,n=4){return shuffle([w,...shuffle(W.filter(x=>x!==w)).slice(0,n-1)])}
function lock(){document.querySelectorAll('#task .opt,#task .tile,#task .blank,#task .chip').forEach(b=>b.disabled=true)}

function listen(w){
 const o=options(w);
 $('#task').innerHTML=`<div class="row" style="margin-top:10px"><button class="btn blue" onclick="sayW('${w.id}')">🔊 Nghe lại</button><button class="btn" onclick="sayW('${w.id}',1)">🐢 Nghe chậm</button></div>
 <div class="grid2">${o.map(x=>`<button class="opt" data-id="${x.id}"><img src="${IMG[x.id]}" alt="hình"></button>`).join('')}</div>`;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=b.dataset.id===w.id;b.classList.add(ok?'ok':'no');
  if(ok){lock();result(true,w,`Đúng! ${w.en} = ${w.vi}`)}else{miss(w,'Chưa đúng, nghe lại nhé!');b.disabled=true}});
 setTimeout(()=>say(w.en),300);
}
function read(w){
 const o=options(w);
 $('#task').innerHTML=`<div class="word center">${w.en}</div><div class="ipa center">${w.ipa}</div>
 <div class="grid2">${o.map(x=>`<button class="opt" data-id="${x.id}">${x.vi}</button>`).join('')}</div><div id="recBox"></div>`;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=b.dataset.id===w.id;b.classList.add(ok?'ok':'no');lock();
  if(!ok)document.querySelector(`.opt[data-id="${w.id}"]`).classList.add('ok');say(w.en);
  $('#recBox').innerHTML=recHTML();bindRec(w);
  result(ok,w,ok?'Đúng rồi! Giờ con đọc to và thu âm nhé 🎙️':`${w.en} nghĩa là "${w.vi}". Con đọc to và thu âm nhé!`,true)});
}
function extra(w){
 const word=norm(w.en), plain=word.replace(/ /g,'');
 // insert one extra letter that is not the same as its neighbours
 const abc='abcdefghiklmnoprstuvwy';let pos,ch,bad;
 do{pos=1+Math.floor(Math.random()*(plain.length-1));ch=abc[Math.random()*abc.length|0];bad=ch===plain[pos-1]||ch===plain[pos]}while(bad);
 const wrongPlain=plain.slice(0,pos)+ch+plain.slice(pos);
 // rebuild with spaces for multi-word phrases
 const lens=word.split(' ').map(x=>x.length);
 const bounds=[];let acc=0;lens.forEach((L,j)=>{acc+=L;if(j<lens.length-1)bounds.push(acc<=pos-1?acc:acc+1)});
 // if extra letter sits exactly on a boundary, keep it with the left word
 $('#task').innerHTML=`<img class="pic" src="${IMG[w.id]}" alt="" style="margin-top:8px;max-height:170px">
 <div class="center"><span class="vi">${w.vi}</span></div>
 <div class="extra">${wrongPlain.split('').map((c,i)=>(bounds.includes(i)?'<div class="gap"></div>':'')+`<button class="tile" data-i="${i}">${c}</button>`).join('')}</div>
 <div class="row"><button class="btn blue" onclick="sayW('${w.id}')">🔊 Nghe từ đúng</button></div>`;
 let wrongTaps=0;
 document.querySelectorAll('#task .tile').forEach(t=>t.onclick=()=>{const i=+t.dataset.i;
  const fixed=wrongPlain.slice(0,i)+wrongPlain.slice(i+1);
  if(fixed===plain){t.classList.add('ok');lock();setTimeout(()=>{t.hidden=true},500);say(w.en);
   result(wrongTaps<2,w,wrongTaps<2?`Bắt được rồi! Chữ "${t.textContent}" bị thừa 🔍`:`Chữ thừa là "${t.textContent}". Lần sau nhìn kỹ hơn nhé!`)}
  else{wrongTaps++;t.classList.add('no');setTimeout(()=>t.classList.remove('no'),400);miss(w,'Chữ này đúng rồi, tìm chữ khác nhé!')}});
}
function sum(a,n){return a.slice(0,n).reduce((x,y)=>x+y,0)}
function build(w){
 const target=norm(w.en).replace(/ /g,''), words=norm(w.en).split(' ');
 let pos=0;
 const letters=shuffle(target.split(''));
 $('#task').innerHTML=`<img class="pic" src="${IMG[w.id]}" alt="" style="margin-top:8px;max-height:180px">
 <div class="center"><span class="vi">${w.vi}</span> <span class="ipa">${w.ipa}</span></div>
 <div class="slots">${words.map(x=>x.split('').map(()=>'<div class="slot"></div>').join('')).join('<div class="gap"></div>')}</div>
 <div class="tiles">${letters.map(c=>`<button class="tile" data-c="${c}">${c}</button>`).join('')}</div>
 <div class="row" style="margin-top:12px"><button class="btn" onclick="sayW('${w.id}',1)">🐢 Nghe gợi ý</button></div>`;
 const slots=document.querySelectorAll('.slot');let wrong=0;
 document.querySelectorAll('#task .tile').forEach(t=>t.onclick=()=>{
  if(t.dataset.c===target[pos]){slots[pos].textContent=t.dataset.c;t.disabled=true;pos++;
   if(pos===target.length){lock();say(w.en);result(wrong<3,w,wrong<3?'Ghép đúng rồi! 🧩':'Xong rồi, lần sau cố gắng ít sai hơn nhé!')}}
  else{wrong++;t.classList.add('no');setTimeout(()=>t.classList.remove('no'),400);miss(w,'Chữ tiếp theo không phải chữ này')}
 });
}
function speak(w){
 $('#task').innerHTML=`<img class="pic" src="${IMG[w.id]}" alt="" style="margin-top:8px">
 <div class="center"><span class="vi">${w.vi}</span></div>
 <p class="tip center">Con hãy nói to từ tiếng Anh của hình này, thu âm rồi nghe lại.</p>
 ${recHTML()}
 <div id="rev" hidden class="center"><div class="word">${w.en}</div><div class="ipa">${w.ipa}</div><div class="read">Đọc gần giống: ${w.rd}</div></div>
 <div class="row" id="sp1" style="margin-top:12px"><button class="btn primary" id="show">👀 Xem đáp án</button></div>
 <div class="row" id="sp2" hidden style="margin-top:12px">
  <button class="btn primary" id="yes">✅ Con nói đúng</button>
  <button class="btn" id="again">🔁 Nói lại</button>
 </div>`;
 bindRec(w);
 $('#show').onclick=()=>{$('#rev').hidden=false;$('#sp1').hidden=true;$('#sp2').hidden=false;say(w.en)};
 $('#yes').onclick=()=>{$('#sp2').hidden=true;result(true,w,'Phát âm hay lắm! 🗣️')};
 $('#again').onclick=()=>{say(w.en,1);$('#recTip').textContent='Nghe chậm rồi thu âm lại nhé!'};
}
function fill(w){
 const [a,b]=w.s.split('___');
 $('#task').innerHTML=`<img class="pic" src="${IMG[w.id]}" alt="" style="margin-top:8px;max-height:170px">
 <div class="sent">${esc(a)}<input class="blank" id="blank" autocomplete="off" autocapitalize="off" spellcheck="false" size="${Math.max(6,w.en.length)}" aria-label="ô trống">${esc(b)}</div>
 <p class="tip center">${w.sv}</p>
 <div class="label" style="margin-top:8px">Chạm vào từ để điền, hoặc tự gõ</div>
 <div class="chips">${shuffle(W).map(x=>`<button class="chip" data-w="${x.en}">${x.en}</button>`).join('')}</div>
 <div class="row" style="margin-top:12px"><button class="btn blue" onclick="say('${esc(w.s.replace('___','...'))}')">🔊 Nghe câu</button><button class="btn primary" id="chk">Kiểm tra</button></div>`;
 const inp=$('#blank');let tries=0;
 document.querySelectorAll('#task .chip').forEach(c=>c.onclick=()=>{inp.value=c.dataset.w;say(c.dataset.w)});
 const chk=()=>{const v=norm(inp.value);
  if(v===norm(w.en)){lock();inp.disabled=true;say(w.s.replace('___',w.en));result(true,w,'Điền đúng rồi! 📝')}
  else{tries++;if(tries>=2){inp.value='';miss(w,`Từ đúng là: ${w.en}. Con điền lại nhé!`)}else miss(w,'Chưa đúng, đọc lại câu và nhìn hình nhé!')}};
 $('#chk').onclick=chk;inp.onkeydown=e=>{if(e.key==='Enter')chk()};
}
function write(w){
 $('#task').innerHTML=`<img class="pic" src="${IMG[w.id]}" alt="" style="margin-top:8px;max-height:180px">
 <div class="center"><span class="vi">${w.vi}</span> <span class="ipa">${w.ipa}</span></div>
 <div class="row" style="margin-top:10px"><button class="btn blue" onclick="sayW('${w.id}')">🔊 Nghe</button><button class="btn" onclick="sayW('${w.id}',1)">🐢 Chậm</button><button class="btn" id="hint">💡 Gợi ý</button></div>
 <input class="type" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="gõ từ ở đây">
 <div class="row" style="margin-top:10px"><button class="btn primary" id="chk">Kiểm tra</button></div>`;
 let tries=0, hints=0;
 $('#hint').onclick=()=>{hints++;const a=$('#ans');a.value=w.en.slice(0,Math.min(w.en.length,hints+1));a.focus()};
 const chk=()=>{const v=norm($('#ans').value);
  if(v===norm(w.en)){$('#ans').disabled=true;$('#chk').disabled=true;say(w.en);result(true,w,'Viết đúng chính tả! ✏️')}
  else{tries++;if(tries>=2){$('#ans').value='';miss(w,`Từ đúng là: ${w.en}. Con gõ lại nhé!`)}else miss(w,'Gần đúng rồi, nghe lại và sửa nhé!')}};
 $('#chk').onclick=chk;$('#ans').onkeydown=e=>{if(e.key==='Enter')chk()};
 setTimeout(()=>{const a=$('#ans');if(!a)return;say(w.en);a.focus()},300);
}
function finish(){
 stopRec();
 if(stars>best){best=stars;try{localStorage.setItem('gb13best',best)}catch(e){}}
 const hard=W.filter(w=>G.miss[w.id]).sort((a,b)=>G.miss[b.id]-G.miss[a.id]);
 app.innerHTML=head()+`<div class="card center"><div class="big">🏆</div><div class="word">Hoàn thành!</div>
 <p>Con được <b>⭐ ${stars}</b> ngôi sao.</p>
 ${hard.length?`<p class="tip">Từ cần ôn thêm (chạm để mở thẻ lật):</p><div class="learnlist">${hard.map(w=>`<button class="mini" onclick="learn(${W.indexOf(w)})"><b>${w.en}</b><span>${w.ipa}</span><div class="read">${w.vi} · sai ${G.miss[w.id]} lần</div></button>`).join('')}</div>`:'<p>Không sai từ nào. Tuyệt vời! 🌟</p>'}
 <div class="rec" style="text-align:left">
  <div class="label">📨 Gửi kết quả cho cô</div>
  <label for="kidName" class="tip" style="display:block">Tên của con</label>
  <input class="type" id="kidName" style="margin-top:4px;font-size:1.2rem" placeholder="Ví dụ: Nguyễn Minh An" autocomplete="off">
  <textarea id="report" readonly rows="6" style="width:100%;margin-top:10px;font:600 .95rem var(--body);padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical"></textarea>
  <div class="row" style="margin-top:10px"><button class="btn primary" id="copyRep">📋 Sao chép kết quả</button></div>
  <p class="tip" id="copyTip">Sao chép xong, bố mẹ dán vào nhóm Zalo lớp 2A8 để gửi cô nhé.</p>
 </div>
 <div class="row" style="margin-top:14px"><button class="btn" onclick="home()">Về đầu</button><button class="btn primary" onclick="play(G.list)">Chơi lại</button></div></div>`;
 beep(1);
 const nm=$('#kidName'),rep=$('#report');
 try{nm.value=localStorage.getItem('gb13name')||''}catch(e){}
 const d=new Date(),p=n=>String(n).padStart(2,'0');
 const build=()=>{const name=nm.value.trim()||'(chưa ghi tên)';
  rep.value=`🌟 Góc Bảng Tuần 13 – Lớp 2A8\nBé: ${name}\nĐã chơi: ${G.list.map(k=>STAGES[k].name.replace(/^\S+\s/,'')).join(', ')}\nĐiểm: ⭐ ${stars}/${G.total}\n${hard.length?'Từ cần ôn: '+hard.map(w=>w.en).join(', '):'Không sai từ nào 🎉'}\nThời gian: ${p(d.getHours())}:${p(d.getMinutes())} ngày ${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`};
 build();
 nm.oninput=()=>{build();try{localStorage.setItem('gb13name',nm.value.trim())}catch(e){}};
 $('#copyRep').onclick=()=>{build();const ok=()=>{$('#copyTip').textContent='Đã sao chép! Mở nhóm Zalo lớp và dán vào ô tin nhắn nhé.'};
  const fail=()=>{rep.focus();rep.select();$('#copyTip').textContent='Máy chưa tự sao chép được. Chữ đã được bôi đen, bấm giữ rồi chọn Sao chép nhé.'};
  try{navigator.clipboard.writeText(rep.value).then(ok,fail)}catch(e){fail()}};
}
home();
</script>

</body></html>
